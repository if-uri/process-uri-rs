[package]
name = "process-uri"
version = "0.1.0"
edition = "2021"
description = "Fast RFC 3986 Process URI / Resource URN parser, System-1 calibrated router, and GBNF grammar generator for LLMs"
license = "Apache-2.0"

[lib]
name = "process_uri_rs"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "process-uri"
path = "src/main.rs"

[dependencies]
pyo3 = { version = "0.22", features = ["abi3-py310"], optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
url = "2.5"

[features]
default = ["python"]
python = ["dep:pyo3"]
extension-module = ["python", "pyo3/extension-module"]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
